[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SusceptibilityTools"
version = "0.1.0.dev0"
description = "Electronic susceptibilities, interaction-driven instabilities, and Hartree-Fock calculations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["chi_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
